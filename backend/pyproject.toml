[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-insights"
version = "0.1.0"
description = "Live football intelligence, explained and personalised."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Agents: Microsoft Agent Framework with the OpenAI-compatible client (Foundry v1 API, GitHub Models)
    "agent-framework-core>=1.22,<2",
    "agent-framework-openai>=1.17,<2",
    "openai>=3.30,<4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["pitch_insights*"]

[tool.setuptools.package-data]
pitch_insights = ["generator/*.yaml", "interpret/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
