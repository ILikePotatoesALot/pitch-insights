[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-insights"
version = "0.1.0"
description = "Live football intelligence, explained and personalised."
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["pitch_insights*"]

[tool.setuptools.package-data]
pitch_insights = ["generator/*.yaml", "interpret/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
